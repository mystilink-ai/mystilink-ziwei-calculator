[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mystilink-ziwei-calculator"
version = "0.2.1"
description = "Zi Wei Dou Shu (Purple Star) chart calculator with JSON CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mystilink" }]
keywords = ["ziwei", "zwds", "purple-star", "calendar", "cli"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Utilities",
]
dependencies = [
  "zhdate",
]

[project.scripts]
ziwei = "mystilink_ziwei.cli:main"
mystilink-ziwei = "mystilink_ziwei.cli:main"


[tool.setuptools.packages.find]
include = ["mystilink_ziwei*"]
